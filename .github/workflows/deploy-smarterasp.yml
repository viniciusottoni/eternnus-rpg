name: Deploy Eternnus RPG to SmarterASP.NET

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eternnus-rpg-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    environment: production
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: 'true'
      PUBLISH_DIR: artifacts/ftp-publish
      FTP_SERVER_DIR: ${{ vars.SMARTERASP_FTP_SERVER_DIR }}

    steps:
      - name: Checkout merged main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore, build and test .NET
        shell: pwsh
        run: |
          dotnet restore Eternnus.sln
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet build Eternnus.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          dotnet test tests/Eternnus.Tests/Eternnus.Tests.csproj -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Test JavaScript frontend and PWA
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem tests -Filter '*.test.mjs' -File | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw "No tests found" }
          node --test $tests
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed" }

      - name: Create fresh IIS publish package
        shell: pwsh
        run: |
          if (Test-Path $env:PUBLISH_DIR) { Remove-Item $env:PUBLISH_DIR -Recurse -Force }
          dotnet publish apps/Eternnus.Web/Eternnus.Web.csproj -c Release --no-restore --self-contained false -o $env:PUBLISH_DIR
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          # SmarterASP runs IIS on Windows. Native assets for Linux/macOS/ARM (~220 MB) are never
          # loaded there; keep win (managed), win-x64 and win-x86 because the app pool bitness may vary.
          $runtimes = Join-Path $env:PUBLISH_DIR 'runtimes'
          if (Test-Path $runtimes) {
            Get-ChildItem $runtimes -Directory |
              Where-Object { $_.Name -notin @('win', 'win-x64', 'win-x86') } |
              Remove-Item -Recurse -Force
          }
          $size = (Get-ChildItem $env:PUBLISH_DIR -File -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ("Publish package: {0:N1} MB" -f ($size / 1MB))

      - name: Validate publish contents
        shell: pwsh
        run: |
          foreach ($file in @('Eternnus.Web.dll', 'web.config', 'wwwroot/index.html', 'wwwroot/service-worker.js', 'wwwroot/manifest.webmanifest')) {
            if (-not (Test-Path (Join-Path $env:PUBLISH_DIR $file))) {
              throw "Publish package incomplete: $file"
            }
          }
          $private = @(Get-ChildItem $env:PUBLISH_DIR -File -Recurse | Where-Object {
            $_.Name -eq 'appsettings.Development.json' -or
            $_.Name -like '*.local.json' -or
            $_.Extension -eq '.eml' -or
            $_.FullName -match '[\\/]App_Data[\\/]'
          })
          if ($private.Count -gt 0) { throw 'Publish contains development or private files' }
          $foreign = @(Get-ChildItem (Join-Path $env:PUBLISH_DIR 'runtimes') -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notin @('win', 'win-x64', 'win-x86') })
          if ($foreign.Count -gt 0) { throw 'Publish still contains non-Windows native runtimes' }

      - name: Smoke test the real published package
        shell: pwsh
        env:
          ETERNNUS_PUBLISH_DIR: artifacts/ftp-publish
        run: |
          node tests/release.mjs
          if ($LASTEXITCODE -ne 0) { throw "Release smoke test failed" }

      - name: Build self-contained canonical maintenance screen
        shell: pwsh
        run: |
          ./.github/scripts/build-app-offline.ps1 -Output "$env:PUBLISH_DIR/app_offline.htm"
          if (-not (Test-Path "$env:PUBLISH_DIR/app_offline.htm")) { throw "No app_offline.htm generated" }

      - name: Validate isolated FTPS target and secrets
        shell: pwsh
        env:
          SMARTERASP_FTP_SERVER: ${{ secrets.SMARTERASP_FTP_SERVER }}
          SMARTERASP_FTP_USERNAME: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          SMARTERASP_FTP_PASSWORD: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
        run: |
          foreach ($key in @('SMARTERASP_FTP_SERVER', 'SMARTERASP_FTP_USERNAME', 'SMARTERASP_FTP_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
              throw "Missing required GitHub production secret: $key"
            }
          }
          if ($env:SMARTERASP_FTP_SERVER -notmatch '^[a-zA-Z0-9.-]+$') {
            throw "SMARTERASP_FTP_SERVER must be a hostname only"
          }
          if ($env:FTP_SERVER_DIR -notmatch '^\./(?:[A-Za-z0-9_.-]+/)*$' -or $env:FTP_SERVER_DIR -match '(^|/)\.\.(/|$)') {
            throw "Set variable SMARTERASP_FTP_SERVER_DIR to the exact isolated IIS application directory (e.g. ./rpg/ or ./)"
          }
          Write-Host "Validated FTPS directory: $env:FTP_SERVER_DIR"

      - name: Enable canonical loading during IIS restart
        id: offline
        shell: pwsh
        env:
          SMARTERASP_FTP_SERVER: ${{ secrets.SMARTERASP_FTP_SERVER }}
          SMARTERASP_FTP_USERNAME: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          SMARTERASP_FTP_PASSWORD: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
        run: |
          $remote = $env:FTP_SERVER_DIR.Substring(2) + 'app_offline.htm'
          curl.exe --fail --show-error --silent --ssl-reqd --ftp-create-dirs --user "$($env:SMARTERASP_FTP_USERNAME):$($env:SMARTERASP_FTP_PASSWORD)" --upload-file "$env:PUBLISH_DIR/app_offline.htm" "ftp://$($env:SMARTERASP_FTP_SERVER)/$remote"
          if ($LASTEXITCODE -ne 0) { throw "Maintenance marker upload failed" }
          Start-Sleep -Seconds 15

      # FTP-Deploy-Action (basic-ftp) lost the TLS data socket on this server (ECONNRESET) before
      # uploading anything. curl.exe already uploads app_offline.htm here successfully, so the
      # package uses the same client, in retried batches. Remote files are never deleted.
      - name: Publish to SmarterASP via FTPS
        id: upload
        timeout-minutes: 25
        shell: pwsh
        env:
          SMARTERASP_FTP_SERVER: ${{ secrets.SMARTERASP_FTP_SERVER }}
          SMARTERASP_FTP_USERNAME: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          SMARTERASP_FTP_PASSWORD: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
        run: ./.github/scripts/ftps-upload.ps1 -LocalDir $env:PUBLISH_DIR -RemoteDir $env:FTP_SERVER_DIR

      - name: Restore availability even when upload fails
        if: always() && steps.offline.outcome == 'success'
        shell: pwsh
        env:
          SMARTERASP_FTP_SERVER: ${{ secrets.SMARTERASP_FTP_SERVER }}
          SMARTERASP_FTP_USERNAME: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          SMARTERASP_FTP_PASSWORD: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
        run: |
          $remote = $env:FTP_SERVER_DIR.Substring(2) + 'app_offline.htm'
          curl.exe --fail --show-error --silent --ssl-reqd --user "$($env:SMARTERASP_FTP_USERNAME):$($env:SMARTERASP_FTP_PASSWORD)" --quote "DELE $remote" "ftp://$($env:SMARTERASP_FTP_SERVER)/"
          if ($LASTEXITCODE -ne 0) { throw "Could not remove app_offline.htm; manual recovery may be required" }

      - name: Verify production health over HTTPS
        if: success()
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-RestMethod -Uri "https://rpg.eternnus.com/health" -TimeoutSec 12 -Headers @{ 'Cache-Control' = 'no-cache' }
              if ($response.status -eq 'ok') { Write-Host "Production healthy"; exit 0 }
            } catch { Write-Host "Health check pending ($attempt/12)" }
            Start-Sleep -Seconds 5
          }
          throw "FTPS upload finished, but production health is not OK. Check IIS, PostgreSQL and HTTPS."
